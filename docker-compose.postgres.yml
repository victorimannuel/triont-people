services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: people
      POSTGRES_USER: people_app
      POSTGRES_PASSWORD: change-me
    volumes:
      - people_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U people_app -d people"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: change-me-to-a-long-random-secret
      DATABASE_URL: postgresql+psycopg2://people_app:change-me@postgres:5432/people
      AUTO_CREATE_DB: "false"
    ports:
      - "8000:8000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: change-me-to-a-long-random-secret
      DATABASE_URL: postgresql+psycopg2://people_app:change-me@postgres:5432/people
      AUTO_CREATE_DB: "false"
    command: ["python", "-m", "workers.notification_worker"]

volumes:
  people_postgres_data:
